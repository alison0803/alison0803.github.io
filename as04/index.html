<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分鏡</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <section class="scroll-scene intro-scene">
        <div class="sticky-stage">
          <img class="layer intro-first-layer" src="分鏡/%2301.png" alt="分鏡 01" width="1920" height="6000" fetchpriority="high">
        </div>
      </section>

      <figure class="page-two" data-page-two>
        <img class="page-two-image" src="分鏡/%2302.png" alt="分鏡 02" width="1920" height="2280">
        <div class="page-two-mask" aria-hidden="true"></div>
      </figure>
      <div class="black-bridge" aria-hidden="true"></div>

      <figure class="frame fade-in-frame" data-fade-in>
        <img src="分鏡/%2303.png" alt="分鏡 03" width="1920" height="1280" loading="lazy">
      </figure>
      <figure class="frame">
        <img src="分鏡/%2304.png" alt="分鏡 04" width="1920" height="1280" loading="lazy">
      </figure>
      <figure class="frame">
        <img src="分鏡/%2305.png" alt="分鏡 05" width="1920" height="1280" loading="lazy">
      </figure>
      <figure class="frame">
        <img src="分鏡/%2306.png" alt="分鏡 06" width="1920" height="1280" loading="lazy">
      </figure>
      <figure class="frame">
        <img src="分鏡/%2307.png" alt="分鏡 07" width="1920" height="1280" loading="lazy">
      </figure>

      <section class="scroll-scene horizontal-scene" aria-label="分鏡 08 橫向移動" data-horizontal>
        <div class="sticky-stage horizontal-stage">
          <img src="分鏡/%2308.png" alt="分鏡 08" width="5000" height="1280" loading="lazy">
        </div>
      </section>

      <section class="scroll-scene sequence-scene" data-sequence>
        <div class="sticky-stage">
          <img class="layer" src="分鏡/%2309.png" alt="分鏡 09" width="1920" height="1280" loading="lazy">
          <div class="lower-mask" aria-hidden="true"></div>
          <img class="layer sequence-layer sequence-layer-10" src="分鏡/%2310.png" alt="分鏡 10" width="1920" height="1280" loading="lazy">
          <img class="layer sequence-layer sequence-layer-11" src="分鏡/%2311.png" alt="分鏡 11" width="1920" height="1280" loading="lazy">
        </div>
      </section>

      <section class="scroll-scene crossfade-scene slow-crossfade" data-crossfade>
        <div class="sticky-stage">
          <img class="layer" src="分鏡/%2312.png" alt="分鏡 12" width="1920" height="1280" loading="lazy">
          <img class="layer crossfade-layer" src="分鏡/%2313.png" alt="分鏡 13" width="1920" height="1280" loading="lazy">
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
